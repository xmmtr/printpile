name: Bug 报告
description: 提交可复现的问题，帮助定位
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。安全问题请走 SECURITY.md，不要发公开 Issue。
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 设置/关于页显示的版本号
      placeholder: 例如 1.2.1 或 Win7 1.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2 x64 / Windows 7 SP1 x64
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: 打印机型号与驱动
      placeholder: 例如 HP LaserJet M404dn，官方驱动版本 x.x
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，包括文件格式、数量、相关设置
      placeholder: |
        1. 拖入 20 个 PDF 和 5 个 Word
        2. 设置双面、每页 2 版
        3. 点击开始打印
        4. ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错请贴原文；可附截图
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 程序目录下 logs\ 中的相关日志；含真实文件名/客户信息请先打码
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 我提交的内容不含密码、密钥或未脱敏的客户文件
          required: true
